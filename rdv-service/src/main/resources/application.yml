server:
  port: 8081

spring:
  application:
    name: rdv-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/horizon
  mvc:
    problemdetails:
      enabled: true

guichet:
  notification-service:
    url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
